# CI/CD for the BASIS-China iGEM wiki on gitlab.igem.org.
#
# iGEM runners use public Node images (see the 2026 example wiki). Bun is
# installed in the job so the same lockfile and scripts as local development
# run on iGEM infrastructure. The prerender emits one HTML file per route, so
# deep-link refresh works on GitLab Pages without an SPA redirect hack.
#
# gitlab.igem.org caps job artifacts at 10 MiB. Do not cache node_modules:
# that cache is huge and the Pages upload is the step that must stay small.
image: node:22

# The ARM64 runner capped Node 22's V8 heap near 940 MiB, and Rollup now
# crosses that ceiling while rendering the lazy VGPU chunks. Raise only the JS
# heap while retaining headroom for native buffers, Bun, and the runner.
variables:
  NODE_OPTIONS: "--max-old-space-size=1536"

pages:
  stage: build
  before_script:
    - corepack disable || true
    - npm install -g bun@1.3.6
    - bun --version
    - bun install --frozen-lockfile
  script:
    - bun run build
    - test -f dist/404.html
    - rm -rf dist/.vite
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never # iGEM only deploys the default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
