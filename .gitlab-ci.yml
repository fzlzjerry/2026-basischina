# CI/CD for the BASIS-China iGEM wiki (§25).
#
# Bun is the single package manager. The build runs page validation, type
# checking, sitemap generation, and the vite-react-ssg static prerender, which
# emits one HTML file per route — so deep-link refresh works on GitLab Pages
# without an SPA redirect hack.
image: oven/bun:1.3

stages:
  - install
  - check
  - build
  - deploy

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/

install:
  stage: install
  script:
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

check:
  stage: check
  needs: ["install"]
  script:
    - bun run validate:pages
    - bun run type-check
    - bun run lint:check
    - bun run format:check

build:
  stage: build
  needs: ["install", "check"]
  script:
    - bun run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

# GitLab Pages must publish a `public/` directory. The prerendered output lives
# in `dist/`; `dist/` already contains everything from the source `public/`
# (Vite copies it during build), so we replace `public/` with the built output.
# `404.html` falls back to the SPA shell so unknown deep links still resolve to
# the in-app 404 page.
pages:
  stage: deploy
  needs: ["build"]
  script:
    - cp dist/index.html dist/404.html
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never # iGEM only deploys the default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
